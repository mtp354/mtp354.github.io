name: Personal Radar - Weekly Monday Digest

on:
  workflow_dispatch:
  schedule:
    # Dual UTC triggers with ET gate in script to remain DST-safe.
    - cron: "0 12 * * 1"
    - cron: "0 13 * * 1"

permissions:
  contents: read

jobs:
  personal-radar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/quantum-radar

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: projects/quantum-radar/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Privacy guardrail for Applicant directory
        run: python scripts/check_applicant_privacy.py

      - name: Select top opportunities
        id: select
        run: python scripts/personal_select_top2.py --enforce-time-gate --event-name "${{ github.event_name }}"

      - name: Enrich company and social signals
        if: steps.select.outputs.run_pipeline == 'true'
        run: python scripts/personal_enrich_contacts.py

      - name: Generate CV and cover letter recommendations
        if: steps.select.outputs.run_pipeline == 'true'
        run: python scripts/personal_recommend_docs.py

      - name: Email personal digest
        if: steps.select.outputs.run_pipeline == 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          PERSONAL_REPORT_TO_EMAIL: ${{ secrets.PERSONAL_REPORT_TO_EMAIL }}
          PERSONAL_REPORT_FROM_EMAIL: ${{ secrets.PERSONAL_REPORT_FROM_EMAIL }}
          PERSONAL_REPORT_REPLY_TO: ${{ secrets.PERSONAL_REPORT_REPLY_TO }}
          PERSONAL_REPORT_SUBJECT_PREFIX: Personal Radar Weekly
        run: python scripts/personal_send_email.py

      - name: Upload digest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-radar-digest
          path: |
            projects/quantum-radar/state/personal_radar_selected.json
            projects/quantum-radar/state/personal_radar_enriched.json
            projects/quantum-radar/state/personal_radar_digest.json
            projects/quantum-radar/reports/personal-radar
          if-no-files-found: warn