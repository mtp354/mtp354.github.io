{% if jekyll.environment == "production" and site.analytics.provider == "google-analytics-4" and site.analytics.google.tracking_id %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.analytics.google.tracking_id | uri_escape }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('config', {{ site.analytics.google.tracking_id | jsonify }});
</script>
{% endif %}
