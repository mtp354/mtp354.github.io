# Site-wide Jekyll settings. Restart `jekyll serve` after editing this file;
# Jekyll does not reload configuration changes while the dev server is running.

# Basic Site Settings
locale                   : "en-US"
site_theme               : "default"
title                    : "Matthew Prest"
title_separator          : "-"
name                     : &name "Matthew Prest"
description              : &description "Personal academic website for Matthew Prest, a physics PhD candidate working on quantum information theory."
url                      : https://mtp354.github.io
baseurl                  : ""
repository               : "mtp354/mtp354.github.io"

# Site author details shown in the sidebar and metadata.
author:
  avatar           : "profile.png"
  name             : "Matthew Prest"
  pronouns         : "He/Him"
  bio              : "Physics PhD candidate at the City University of New York working on quantum information theory."
  location         : "Brooklyn, NY"
  employer         : "CUNY"
  email            : "matthewprestnz@gmail.com"
  academia         : https://percprogram.academia.edu/MatthewPrest
  googlescholar    : "https://scholar.google.com/citations?user=fUk15YQAAAAJ&hl=en"
  orcid            : "https://orcid.org/0000-0002-3956-516X"
  researchgate     : "https://www.researchgate.net/profile/Matthew-Prest-2?ev=hdr_xprf"
  codewars         : "mtp354"
  github           : "mtp354"
  kaggle           : "matthewprest"
  stackoverflow    : "31049886"
  goodreads        : "Matthew Prest"
  linkedin         : "matthew-prest"

# Publication category headings.
publication_category:
  conferences:
    title: 'Conference Papers'
  manuscripts:
    title: 'Journal Articles'
  

# Site Settings
teaser                   :  # filename of teaser fallback teaser image placed in /images/, .e.g. "500x300.png"
breadcrumbs              : false # true, false (default)
words_per_minute         : 160
future                   : true
read_more                : "disabled" # if enabled, adds "Read more" links to excerpts
talkmap_link             : false      #change to true to add link to talkmap on talks page
atom_feed:
  hide                   : false     # change to true to hide the RSS feed in the footer
  path                   : # blank (default) uses feed.xml


# SEO Related
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :


# Social metadata
og_image                 :  # Social media default site image
og_description           :  # Social media default site image description
social:
  type                   : Person
  name                   : "Matthew Prest"
  links:
    - "https://github.com/mtp354"
    - "https://www.linkedin.com/in/matthew-prest"
    - "https://scholar.google.com/citations?user=fUk15YQAAAAJ&hl=en"
    - "https://orcid.org/0000-0002-3956-516X"


# Analytics
analytics:
  provider               : "google-analytics-4"
  google:
    tracking_id          : "G-979B8LMLWV"


# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .jekyll-cache
  - .sass-cache
  - .venv
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Gemfile
  - Gemfile.lock
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - projects
  - Applicant
  - Rakefile
  - README
  - README.md
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Site collections rendered by Jekyll.
collections:
  publications:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/
  resources:
    output: true
    permalink: /:collection/:path/
  quantum_radar:
    output: true
    permalink: /quantum-radar/:path/


# These settings control how pages and collections are included in the site
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
      related: true
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: publication
      author_profile: true
      share: true
  # _talks
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true
  # _resources
  - scope:
      path: ""
      type: resources
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
      related: true
      sidebar:
        nav: "resources"
  # _quantum_radar
  - scope:
      path: ""
      type: quantum_radar
    values:
      layout: qr-report
      author_profile: true
      read_time: false
      share: false
      related: false


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # http://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style


# Outputting
permalink: /:categories/:title/
timezone: Etc/UTC # http://en.wikipedia.org/wiki/List_of_tz_database_time_zones


# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Mimic GitHub Pages with --safe
whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji


# Archives
#  Type
#  - GitHub Pages compatible archive pages built with Liquid ~> type: liquid (default)
#  - Jekyll Archives plugin archive pages ~> type: jekyll-archives
#  Path (examples)
#  - Archive page should exist at path when using Liquid method or you can
#    expect broken links (especially with breadcrumbs enabled)
#  - <base_path>/tags/my-awesome-tag/index.html ~> path: /tags/
#  - <base_path/categories/my-awesome-category/index.html ~> path: /categories/
#  - <base_path/my-awesome-category/index.html ~> path: /
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/


# HTML Compression
# - http://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development
